name: Build and Deploy Bold Nivel Website

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://boldnivel.com
          NEXT_PUBLIC_BASE_PATH: /boldnivel-website
          GITHUB_PAGES: 'true'

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Create cPanel deployment ZIP
        run: |
          cd out
          zip -r ../boldnivel-cpanel.zip .

      - name: Upload cPanel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: boldnivel-cpanel
          path: boldnivel-cpanel.zip

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
